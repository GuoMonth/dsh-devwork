name: Alpha package

on:
  push:
    tags: ['v*-alpha.*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run verify
      - run: npm run pack:check
      - name: Build release tarball
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          cd artifacts
          sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-devwork-alpha-package
          path: artifacts/*
          if-no-files-found: error
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.tgz artifacts/SHA256SUMS --verify-tag --prerelease --generate-notes
